- name: "Maya T."
  quote: "Having Sarah with us changed everything. She was calm when I wasn't, knew exactly what to say, and never once made me feel like I was doing anything wrong. Our son's birth was everything I hoped it would be."
  context: "First-time mom, hospital birth"

- name: "Priya & Daniel R."
  quote: "We were skeptical about hiring a doula, but from our first meeting Sarah put us completely at ease. She supported both of us through a long labor and I honestly don't know how we would have managed without her."
  context: "Second birth, birth center"

- name: "Kezia L."
  quote: "The postpartum visits were genuinely lifesaving. Sarah came to us in those hazy first weeks and helped us find our footing as a family. She's the kind of person you want in your corner."
  context: "Postpartum support package"
