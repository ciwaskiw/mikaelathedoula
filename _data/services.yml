- title: "Birth Support"
  icon: "❧"
  description: "Continuous labor support from early labor through delivery. Physical comfort measures, emotional guidance, and advocacy for your birth preferences — for you and your partner."
  includes:
    - Two prenatal visits
    - On-call support from 37 weeks
    - Continuous labor and birth attendance
    - One postpartum follow-up visit

- title: "Postpartum Care"
  icon: "✦"
  description: "In-home visits during the fourth trimester to support your recovery, feeding journey, and transition into parenthood. No agenda — just presence and practical help."
  includes:
    - Newborn care guidance
    - Infant feeding support (breast & bottle)
    - Emotional check-ins for the whole family
    - Resource and referral network

- title: "Childbirth Education"
  icon: "◈"
  description: "Private, personalized birth preparation sessions for you and your support person. We cover what matters to your specific situation — no generic classroom approach."
  includes:
    - Labor stages and comfort techniques
    - Birth setting and team communication
    - Newborn basics
    - Custom to your birth preferences
