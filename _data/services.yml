- title: "Birth Support"
  icon: "❧"
  description: "Continuous labor and birth support from early labor through delivery. Physical comfort measures, emotional guidance, and advocacy for your birth preferences — for you and your partner. I attend all hospitals, all birth centers, and home births where a licensed midwife is present."
  includes:
    - Two prenatal visits
    - On-call support from 37 weeks
    - Continuous labor and birth attendance
    - Postpartum follow-up visit
    - Fees range from $1,500–$2,500 (payment plans available)

- title: "Childbirth Education"
  icon: "◈"
  description: "Private, personalized birth preparation sessions for you and your support person. We cover what matters to your specific situation — no generic classroom approach."
  includes:
    - Labor stages and comfort techniques
    - Birth setting and team communication
    - Newborn basics
    - Custom to your birth preferences

- title: "Virtual Support"
  icon: "✦"
  description: "Remote and virtual doula support for families outside my in-person service area or those who prefer flexible, distance-based care. Available throughout your pregnancy, labor, and postpartum period."
  includes:
    - Prenatal preparation sessions via video call
    - Virtual labor support and guidance
    - Postpartum check-ins
    - Flexible scheduling to fit your needs
